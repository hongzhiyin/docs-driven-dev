[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-driven-dev"
version = "0.1.1"
description = "Portable skill and CLI for docs-driven development scaffolding, audit, and skill sync."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docdev = "docs_driven_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
